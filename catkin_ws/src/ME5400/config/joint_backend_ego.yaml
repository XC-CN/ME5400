# joint_backend_ego_node 参数（只优化 ego）
window_size: 10
lambda_obj: 0.3
score_th: 0.5
track_len_th: 3
max_dt: 0.2
max_dv: 3.0
min_obj_weight: 0.1
optimize_hz: 10.0

# [sigma_x, sigma_y, sigma_yaw]，当 /Odometry 协方差异常时回退
odom_noise_fallback: [0.20, 0.20, 0.10]

odom_topic: /Odometry
tracks_topic: /mctrack/tracked_objects
out_topic: /joint_backend/odom
